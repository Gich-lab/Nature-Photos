<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nature Photos</title>
  <link rel="icon" href="tab-icon.ico" type="image/x-icon" />
  <!-- In <head> so the page never paints unstyled -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header" id="header">
    <div class="header-inner">
      <span class="cascade-text" id="header-text"></span>
    </div>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>

    <div id="lightbox" class="lightbox">
      <div class="lightbox-content">
        <button class="prev" type="button" aria-label="Previous photo"> ❮ </button>
        <img id="lightbox-img" src="" alt="Enlarged image" />
        <button class="next" type="button" aria-label="Next photo"> ❯ </button>
      </div>

      <a id="download" class="download-btn" download>Download</a>
      <div id="lightbox-caption" role="status" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <p id="footerText" class="footer">
      &copy; 2026 Gichuki. All rights reserved.
      <a href="mailto:kenngich@proton.me" class="mail-link" aria-label="E-mail">
        <svg class="mail-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="4.5" width="20" height="15" rx="2" fill="#b89b4f" stroke="#fffdf4" stroke-width="1.6"/>
          <path d="M2.8 5.8 L12 13 L21.2 5.8" fill="none" stroke="#fffdf4"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg></a> E-mail
    </p>
  </footer>

  <script>
    // =====================================================
    // CONFIGURATION
    // =====================================================
    const CONFIG = {
      maxPhotos: 128,
      textCycleDuration: 15000,
      cascadeDuration: 6,
      textLinger: 10,
      imageAnimationDuration: 700,
      // Same "pinpoint" pop as before, but the curve stays between 0 and 1 (no overshoot),
      // so the scale never goes negative or past 1 and never widens a full-width phone image.
      imageEasing: "cubic-bezier(0.22, 1, 0.36, 1)",
      imageDelayBetween: 0,
      touchSwipeThreshold: 50,

      // Auto-roll: pixels per second, and how long after the visitor's last input it resumes.
      scrollSpeed: 55,
      scrollResumeDelay: 3000,
      // false = keep auto-scrolling while images are still loading (new images are added
      // below the viewport, so it can't catch up). true = wait until every image is loaded.
      pauseScrollWhileLoading: false,

      headerTexts: [
        "Explore my wallpapers..",
        "Protect what you photograph",
        "Mti leo, kivuli kesho",
        "Less junk, more jungle!",
        "Think green, act cleaner",
        "Mito yastahili kutunzwa",
        "itunze mito uishi fiti",
        "Admire, don't interfere",
        "Stay wild & awesome!",
        "Get lost, find nature!",
        "Kata takataka si miti",
        "Trees are judging quietly",
        "Waste less, wonder more!",
        "Dunia yajua unakozoa taka",
        "Plant now, brag later!",
        "Let wildlife be wild!",
        "itunze dunia ikutunze"
      ],

      // Photo captions - shown in a popup when the mouse hovers over a photo.
      photoCaptions: {
        "photo2.jpg": "White rhinos (square-lipped, grazers) in the Mt. Kenya forest.",
        "photo3.jpg": "A giraffe poses mid-feeding to admire a photographer in the Kenyan plains.",
        "photo7.jpg": "Wildlife at ILRI Kapiti Conservancy. Credit to Newton.",
        "photo13.jpg": "Don't stare at my plumage, jipe shughuli buana!",
        "photo47.jpg": "Zebra at ILRI Kapiti Conservancy. Credit to Newton.",
        "photo73.jpg": "Sssh...i have a secret...",
        "photo87.jpg": "Lantana camara flowers at ILRI offices.",
        "photo99.jpg": "Photo of the earth taken by Artemis 2 crew as they went around the moon. Credit to NASA.",
        "photo112.jpg": "A Black hole. Credit to NASA.",
        "photo116.jpg": "An elephant in its habitat at the Mt. Kenya forest.",
        "photo121.jpg": "A black rhino (hook-lipped, a browser). Photo taken in a sanctuary in Namibia.",
        "photo126.jpg": "A white rhino (square-lipped, a grazer) stands alert in a park, listening warily to the sound of an approaching vehicle.",
        "photo127.jpg": "A happy Bosco!"
      },

      // Caption shown inside the enlarged (lightbox) view, using the same photoCaptions:
      //   "touch"  = only on touch screens, which have no hover
      //   "always" = on every device; "never" = off
      lightboxCaption: "always",

      gaId: "G-22HE9GQ99B",
      gaScript: "https://www.googletagmanager.com/gtag/js?id=G-22HE9GQ99B",
      sheetsUrl: "https://script.google.com/macros/s/AKfycbwMC8P52A8DPBcwcN3JFU4ov1mPg4e15zmnMfEVnJYVntfz0vy1zVGiBp75O7u5avId/exec",
      githubApiUrl: "https://api.github.com/repos/Gich-lab/Nature-Photos/commits/main"
    };

    // =====================================================
    // STATE
    // =====================================================
    const state = {
      currentImageIndex: 0,
      images: [],
      startX: 0,
      currentHeaderTextIndex: 0,
      galleryInitialized: false,
      loading: false
    };

    let DOM = {};
    let captionImg = null;
    let captionRaf = 0;

    function initializeDOMElements() {
      DOM = {
        header: document.getElementById("header"),
        headerText: document.getElementById("header-text"),
        gallery: document.getElementById("gallery"),
        lightbox: document.getElementById("lightbox"),
        lightboxImg: document.getElementById("lightbox-img"),
        lightboxCaption: document.getElementById("lightbox-caption"),
        downloadBtn: document.getElementById("download"),
        lightboxDownload: document.getElementById("download"),
        footerText: document.getElementById("footerText"),
        nextBtn: document.querySelector(".next"),
        prevBtn: document.querySelector(".prev")
      };
    }

    // =====================================================
    // DEVICE / PAGE HELPERS
    // =====================================================
    function isPageReloaded() {
      const nav = performance.getEntriesByType("navigation")[0];
      if (nav) return nav.type === "reload";
      if (performance.navigation) {
        return performance.navigation.type === performance.navigation.RELOAD;
      }
      return false;
    }

    function detectDevice() {
      return /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "Phone" : "Desktop";
    }
    const isMobile = detectDevice() === "Phone";

    function detectOS() {
      const ua = navigator.userAgent;
      const osMap = {
        "Win": "Windows",
        "Android": "Android",
        "iPhone": "iOS",
        "iPad": "iOS",
        "Linux": "Linux",
        "Mac": "MacOS"
      };
      for (const [key, value] of Object.entries(osMap)) {
        if (ua.includes(key)) return value;
      }
      return "Unknown";
    }

    function detectBrowser() {
      const ua = navigator.userAgent;
      const browserChecks = [
        { pattern: /Edg/i, name: "Edge" },
        { pattern: /Brave/i, name: "Brave" },
        { pattern: /Chrome/i, notPattern: /Edge|OPR/i, name: "Chrome" },
        { pattern: /Safari/i, notPattern: /Chrome/i, name: "Safari" },
        { pattern: /Firefox/i, name: "Firefox" },
        { pattern: /OPR|Opera/i, name: "Opera" }
      ];
      for (const check of browserChecks) {
        if (check.pattern.test(ua) && (!check.notPattern || !check.notPattern.test(ua))) {
          return check.name;
        }
      }
      return "Other";
    }

    function getDeviceInfo() {
      return {
        device: detectDevice(),
        os: detectOS(),
        browser: detectBrowser(),
        screen: `${window.innerWidth}x${document.documentElement.clientHeight}`
      };
    }

    // =====================================================
    // ANALYTICS / TRACKING
    // =====================================================
    function loadGA() {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", CONFIG.gaId);
      const script = document.createElement("script");
      script.async = true;
      script.src = CONFIG.gaScript;
      document.head.appendChild(script);
    }

    function sendVisitorData(eventType = "visit", imageName = "") {
      const data = {
        event: eventType,
        time: new Date().toISOString(),
        Image: imageName,
        ...getDeviceInfo()
      };
      fetch(CONFIG.sheetsUrl, {
        method: "POST",
        body: JSON.stringify(data)
      }).catch(err => console.error("Log failed:", err));
    }

    // Once per session
    function initializeTracking() {
      const key = "pageSessionId";
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, 1);
        sendVisitorData("visit");
      }
    }

    // =====================================================
    // HEADER TEXT
    // =====================================================
    function triggerCascade(element, text, totalDuration = CONFIG.cascadeDuration, loop = true) {
      clearTimeout(element.cascadeTimer);

      function animate() {
        element.style.visibility = "visible";
        element.textContent = "";
        const delayIncrement = totalDuration / text.length;

        for (let i = 0; i < text.length; i++) {
          const span = document.createElement("span");
          span.innerHTML = (text[i] === " ") ? "&nbsp;" : text[i];
          span.style.setProperty("--delay", `${i * delayIncrement}s`);
          element.appendChild(span);
        }

        if (loop) {
          element.cascadeTimer = setTimeout(animate, (totalDuration + CONFIG.textLinger) * 1000);
        }
      }
      animate();
    }

    function cycleHeaderTexts() {
      triggerCascade(DOM.headerText, CONFIG.headerTexts[state.currentHeaderTextIndex]);
      state.currentHeaderTextIndex = (state.currentHeaderTextIndex + 1) % CONFIG.headerTexts.length;
      setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);
    }

    // Keep the gallery clear of the fixed header, even when the title wraps to two lines.
    // A ResizeObserver only fires when the header's own size changes (not when the phone's
    // address bar shows or hides), so it can't cause layout jumps while scrolling.
    function watchHeaderHeight() {
      const apply = () => {
        const h = DOM.header.offsetHeight + "px";
        if (DOM.gallery.style.marginTop !== h) DOM.gallery.style.marginTop = h;
      };
      apply();
      new ResizeObserver(apply).observe(DOM.header);
    }

    // =====================================================
    // IMAGE LOADING
    // =====================================================
    function animateImageAppearance(img) {
      return img.animate(
        [
          { opacity: 0, transform: "scale(0.05)" },
          { opacity: 1, transform: "scale(1)" }
        ],
        {
          duration: CONFIG.imageAnimationDuration,
          easing: CONFIG.imageEasing,
          iterations: 1
        }
      ).finished;
    }

    // decode() resolves once the image is fully decoded, so the first animation frame
    // doesn't have to do that work. It rejects for missing files (404), which we skip.
    function whenReady(img) {
      if (img.decode) return img.decode();
      return new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });
    }

    async function loadImagesSequentially() {
      state.loading = true;

      for (let i = CONFIG.maxPhotos; i >= 1; i--) { // newest upload first
        const img = new Image();
        img.decoding = "async";
        img.alt = `Photo ${i}`;
        img.src = `images/photo${i}.jpg`;

        try {
          await whenReady(img);
        } catch {
          continue; // file doesn't exist
        }

        DOM.gallery.appendChild(img); // sizing and styling come from style.css
        await animateImageAppearance(img);

        if (CONFIG.imageDelayBetween > 0) {
          await new Promise(resolve => setTimeout(resolve, CONFIG.imageDelayBetween));
        }
      }

      state.loading = false;
      state.images = document.querySelectorAll("#gallery img");
      DOM.footerText.style.display = "block";
      DOM.footerText.style.opacity = "1";
      state.galleryInitialized = true;
    }

    // =====================================================
    // LIGHTBOX
    // =====================================================
    const lightboxOpen = () => DOM.lightbox.classList.contains("active");

    function showImage(index) {
      state.images = document.querySelectorAll("#gallery img");
      if (!state.images.length) return;

      state.currentImageIndex = index;
      DOM.lightboxImg.src = state.images[index].src;
      updateLightboxCaption(state.images[index]);

      DOM.downloadBtn.href = state.images[index].src;
      DOM.downloadBtn.download = state.images[index].src.split("/").pop();
    }

    function navigateImage(direction) {
      if (!state.images.length) return;
      const step = direction === "next" ? 1 : -1;
      state.currentImageIndex = (state.currentImageIndex + step + state.images.length) % state.images.length;
      showImage(state.currentImageIndex);
    }

    function closeLightbox() {
      cancelAnimationFrame(captionRaf);
      DOM.lightbox.classList.remove("active");
      DOM.lightboxCaption.style.display = "none";
      captionImg = null;
    }

    function openLightbox(imgElement) {
      state.images = document.querySelectorAll("#gallery img");
      state.currentImageIndex = Array.from(state.images).indexOf(imgElement);
      DOM.lightbox.classList.add("active");
      showImage(state.currentImageIndex);
    }

    // Look up the caption for a gallery image, by file name or by photo number.
    // Returns { title, text } or null when that photo has no caption.
    function getCaption(img) {
      const file = decodeURIComponent(img.src.split("?")[0].split("/").pop());
      const num = file.match(/^photo(\d+)\.jpg$/i);
      const entry = CONFIG.photoCaptions[file] ?? (num ? CONFIG.photoCaptions[Number(num[1])] : undefined);
      if (!entry) return null;
      return typeof entry === "string" ? { title: entry, text: "" } : entry;
    }

    // Place the caption just above the enlarged image
    function positionLightboxCaption() {
      const box = DOM.lightboxCaption;
      if (!box || !captionImg || box.style.display === "none") return;

      const rect = captionImg.getBoundingClientRect();
      const vw = document.documentElement.clientWidth;

      box.style.position = "fixed";
      box.style.transition = "none";
      box.style.transform = "none";
      box.style.width = "max-content";
      box.style.maxWidth = Math.min(rect.width, vw - 16) + "px";
      box.style.whiteSpace = "normal";
      box.style.overflowWrap = "anywhere";
      box.style.right = "auto";
      box.style.bottom = "auto";

      const w = box.offsetWidth;
      const h = box.offsetHeight;
      const left = rect.left + (rect.width - w) / 2;
      box.style.left = Math.max(8, Math.min(left, vw - w - 8)) + "px";
      box.style.top = Math.max(8, rect.top - h - 10) + "px"; // grows upward with more lines
    }

    // Download button: below the image on phones, inside it on desktop
    function positionLightboxDownload() {
      const btn = DOM.lightboxDownload;
      const img = DOM.lightboxImg;
      if (!btn || !img || !lightboxOpen()) return;

      const rect = img.getBoundingClientRect();
      const vw = document.documentElement.clientWidth;
      const vh = document.documentElement.clientHeight;

      btn.style.position = "fixed";
      btn.style.transform = "none";
      btn.style.right = "auto";
      btn.style.bottom = "auto";

      const w = btn.offsetWidth;
      const h = btn.offsetHeight;
      const left = rect.left + (rect.width - w) / 2;
      btn.style.left = Math.max(8, Math.min(left, vw - w - 8)) + "px";

      if (isMobile) {
        btn.style.top = Math.min(rect.bottom + 10, vh - h - 4) + "px";
      } else {
        btn.style.top = (rect.bottom - h - 12) + "px";
      }
    }

    // Re-position for a short while, because the image is still loading / resizing
    function trackLightboxCaption(ms = 800) {
      cancelAnimationFrame(captionRaf);
      const end = performance.now() + ms;
      const tick = () => {
        positionLightboxCaption();
        positionLightboxDownload();
        if (performance.now() < end) captionRaf = requestAnimationFrame(tick);
      };
      tick();
    }

    function updateLightboxCaption(img) {
      const box = DOM.lightboxCaption;
      if (!box) return;

      const mode = CONFIG.lightboxCaption;
      const isTouch = window.matchMedia("(hover: none), (pointer: coarse)").matches;
      const wanted = mode === "always" || (mode === "touch" && isTouch);
      const caption = wanted ? getCaption(img) : null; // img = thumbnail, used for text only

      if (!caption) {
        box.style.display = "none";
        captionImg = null;
        trackLightboxCaption(); // still position the download button
        return;
      }

      const title = document.createElement("strong");
      title.textContent = caption.title;
      box.replaceChildren(title);
      if (caption.text) {
        const text = document.createElement("span");
        text.textContent = caption.text;
        box.appendChild(text);
      }
      box.style.display = "block";

      captionImg = DOM.lightboxImg; // measure the big lightbox image, not the thumbnail
      trackLightboxCaption();
      if (!captionImg.complete) {
        captionImg.addEventListener("load", () => trackLightboxCaption(), { once: true });
      }
    }

    // =====================================================
    // HOVER POPUP (desktop)
    // =====================================================
    function setupPhotoTooltip() {
      // Touch screens have no hover (a tap opens the lightbox instead)
      if (!window.matchMedia("(hover: hover)").matches) return;

      const tip = document.createElement("div");
      tip.id = "photo-tip";
      tip.setAttribute("role", "tooltip");
      const tipTitle = document.createElement("strong");
      const tipText = document.createElement("span");
      tip.append(tipTitle, tipText);
      document.body.appendChild(tip);

      // Keep the popup next to the cursor, flipping it if it would leave the screen
      function place(e) {
        const gap = 16, margin = 8;
        const w = tip.offsetWidth, h = tip.offsetHeight;
        let x = e.clientX + gap;
        let y = e.clientY + gap;
        if (x + w > window.innerWidth - margin) x = e.clientX - w - gap;
        if (y + h > window.innerHeight - margin) y = e.clientY - h - gap;
        tip.style.transform = `translate(${Math.max(margin, x)}px, ${Math.max(margin, y)}px)`;
      }

      function hide() {
        tip.classList.remove("visible");
      }

      function show(e) {
        const caption = getCaption(e.target);
        if (!caption) { hide(); return; }
        tipTitle.textContent = caption.title; // textContent: never treated as HTML
        tipText.textContent = caption.text || "";
        tipText.style.display = caption.text ? "block" : "none";
        place(e);
        tip.classList.add("visible");
      }

      // Listen on the container so images added later are covered too
      DOM.gallery.addEventListener("mouseover", (e) => {
        if (e.target.tagName === "IMG") show(e);
      });
      DOM.gallery.addEventListener("mousemove", (e) => {
        if (e.target.tagName !== "IMG") return;
        if (tip.classList.contains("visible")) place(e); else show(e);
      });
      DOM.gallery.addEventListener("mouseout", (e) => {
        if (e.target.tagName === "IMG") hide();
      });
      DOM.gallery.addEventListener("click", hide); // the lightbox opens on click
      window.addEventListener("scroll", hide, { passive: true });
    }

    // =====================================================
    // CONTENT UPDATE CHECK (GitHub commit)
    // =====================================================
    function fetchLatestCommitSha() {
      fetch(CONFIG.githubApiUrl)
        .then(response => {
          if (!response.ok) throw new Error("GitHub API " + response.status);
          return response.json();
        })
        .then(data => {
          const latestCommitSha = data.sha;
          const storedSha = sessionStorage.getItem("storedSha");

          DOM.headerText.style.visibility = "visible";
          initializeTracking();

          if (latestCommitSha === storedSha && isPageReloaded()) {
            // Reloaded with the same content
            DOM.headerText.textContent = "More images soon...";
            triggerCascade(DOM.headerText, DOM.headerText.textContent, CONFIG.cascadeDuration, false);
            setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);

            state.images = document.querySelectorAll("#gallery img");
            if (state.images.length > 0) {
              DOM.footerText.style.opacity = "1";
              state.galleryInitialized = true;
            }
          } else if (latestCommitSha !== storedSha) {
            // New content
            cycleHeaderTexts();
            sessionStorage.setItem("storedSha", latestCommitSha);
            loadGA();
          }
        })
        .catch(err => {
          // GitHub unreachable or rate-limited: still show the header and log the visit
          console.error("Commit check failed:", err);
          DOM.headerText.style.visibility = "visible";
          initializeTracking();
          cycleHeaderTexts();
        });
    }

    // =====================================================
    // AUTO-ROLL
    // Follows the page down slowly; pauses while the visitor is in control.
    // =====================================================
    const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);

    let y = scrollY, last = null, lastInput = -Infinity;

    function setupAutoRoll() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      // touchend is included so momentum scrolling after a flick isn't overridden
      ["wheel", "touchstart", "touchmove", "touchend", "keydown", "mousedown"].forEach(ev =>
        addEventListener(ev, () => { lastInput = performance.now(); }, { passive: true })
      );

      function roll(t) {
        const dt = last === null ? 0 : Math.min(t - last, 50); // clamp so returning from another tab doesn't jump
        last = t;

        if (t - lastInput < CONFIG.scrollResumeDelay) {
          y = scrollY; // visitor is in control
        } else if (
          !lightboxOpen() && !typing() &&
          !(CONFIG.pauseScrollWhileLoading && state.loading)
        ) {
          const max = document.documentElement.scrollHeight - innerHeight;
          if (max > 0) {
            const wave = 1 + 0.5 * Math.sin(t / 4000); // gentle speed-up and slow-down
            y = Math.min(y + (CONFIG.scrollSpeed / 1000) * dt * wave, max);

            // Phones snap scroll positions to whole device pixels. Only scroll when the
            // whole-pixel value changes; fractional calls just make the motion uneven.
            const target = Math.round(y);
            if (target !== Math.round(scrollY)) {
              scrollTo({ top: target, behavior: "instant" });
            }
          }
        }
        requestAnimationFrame(roll);
      }
      requestAnimationFrame(roll);
    }

    // =====================================================
    // EVENTS
    // =====================================================
    function setupEventListeners() {
      // Open lightbox
      DOM.gallery.addEventListener("click", (e) => {
        if (e.target.tagName === "IMG") openLightbox(e.target);
      });

      // Prev / next
      DOM.nextBtn?.addEventListener("click", () => navigateImage("next"));
      DOM.prevBtn?.addEventListener("click", () => navigateImage("prev"));

      // Keyboard
      document.addEventListener("keydown", (e) => {
        if (!lightboxOpen()) return;
        if (e.key === "ArrowRight") DOM.nextBtn?.click();
        if (e.key === "ArrowLeft") DOM.prevBtn?.click();
        if (e.key === "Escape") closeLightbox();
      });

      // Close on background click
      DOM.lightbox.addEventListener("click", (e) => {
        if (e.target === DOM.lightbox) closeLightbox();
      });

      // Swipe
      DOM.lightbox.addEventListener("touchstart", (e) => {
        state.startX = e.touches[0].clientX;
      }, { passive: true });
      DOM.lightbox.addEventListener("touchend", (e) => {
        const diff = state.startX - e.changedTouches[0].clientX;
        if (diff > CONFIG.touchSwipeThreshold) DOM.nextBtn?.click();
        if (diff < -CONFIG.touchSwipeThreshold) DOM.prevBtn?.click();
      }, { passive: true });

      // Download tracking
      DOM.downloadBtn.addEventListener("click", () => {
        sendVisitorData("download", DOM.lightboxImg.src.split("/").pop());
      });

      // Re-place the lightbox caption / download button on resize or rotation
      window.addEventListener("resize", () => trackLightboxCaption(300));

      // Start loading images once the page has loaded
      window.addEventListener("load", async () => {
        if (!state.galleryInitialized) await loadImagesSequentially();
      });
    }

    // =====================================================
    // START
    // =====================================================
    function initializeApp() {
      initializeDOMElements();
      watchHeaderHeight();
      fetchLatestCommitSha();
      setupEventListeners();
      setupPhotoTooltip();
      setupAutoRoll();
    }

    document.addEventListener("DOMContentLoaded", initializeApp);
  </script>
</body>
</html>
