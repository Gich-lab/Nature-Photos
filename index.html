<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="tab-icon.ico" type="image/x-icon" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="favorite-indicator"
    style="position:fixed; top:15px; right:15px; font-size:32px; color:#00ff66; z-index:100000; display:none; text-shadow:0 0 10px rgba(0,0,0,0.6);">
    ♥
  </div>
  
  <header class="main-header" id="header">
    <div class="header-inner">
      <span class="cascade-text" id="header-text" style="visibility: hidden;"></span>     
    </div>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" style="display:none; z-index:9999;">
      <div class="lightbox-content">
        <button class="prev" aria-label="Previous">❮ Prev</button>

        <img id="lightbox-img" src="" alt="Enlarged image" style="display:block; max-width:90vw; max-height:90vh; object-fit:contain; border-radius:8px;">

        <button class="next" aria-label="Next">Next ❯</button>

        <!-- Centered controls at the bottom of the lightbox image -->
        <div class="lightbox-controls" role="group" aria-label="Lightbox controls">
          <button id="favorite-btn" class="favorite-btn" aria-pressed="false" title="Favorite">♡</button>

          <a id="download" class="download-btn" href="#" download title="Download">Download</a>
        </div>
      </div>
    </div>

    <!-- Download confirmation modal (hidden by default) -->
    <div id="download-confirm" class="download-confirm hidden" role="dialog" aria-modal="true" aria-labelledby="download-confirm-title">
      <p id="download-confirm-title" style="margin:0 0 12px 0;">Proceed to download all?</p>
      <div style="display:flex; gap:12px; justify-content:center;">
        <button id="confirm-yes" class="confirm-yes">Yes</button>
        <button id="confirm-no" class="confirm-no">No</button>
      </div>
    </div>
  </main>

  <footer>
    <p id="footerText" class="footer" style="text-align: center; display:none; transition:opacity 1s;">
      &copy; <span id="year"></span> 2026 Gichuki. All rights reserved.
      <a href="mailto:kenngich@proton.me" style="text-decoration: none !important;">✉️</a> E-mail
    </p>
  </footer>

  <script>
    // CONFIG (unchanged)
    const CONFIG = {
      maxPhotos: 120,
      imageLoadTimeout: 1000,
      textCycleDuration: 15000,
      cascadeDuration: 6,
      textLinger: 10,
      imageAnimationDuration: 700,
      imageDelayBetween: 0,
      touchSwipeThreshold: 50,
      headerTexts: [
        "Explore my wallpapers..",
        "Mti leo, kivuli kesho",
        "Less junk, more jungle!",
        "Think green, act cleaner",
        "Mito yastahili kutunzwa",
        "itunze mito uishi fiti",
        "Stay wild & awesome!",
        "Get lost, find nature!",
        "Kata takataka si miti",
        "Trees are judging quietly",
        "Waste less, wonder more!",
        "Dunia yajua unakozoa taka",
        "Plant now, brag later!",
        "itunze dunia ikutunze"
      ],
      gaId: "G-22HE9GQ99B",
      gaScript: "https://www.googletagmanager.com/gtag/js?id=G-22HE9GQ99B",
      sheetsUrl: "https://script.google.com/macros/s/AKfycbwMC8P52A8DPBcwcN3JFU4ov1mPg4e15zmnMfEVnJYVntfz0vy1zVGiBp75O7u5avId/exec",
      githubApiUrl: "https://api.github.com/repos/Gich-lab/Nature-Photos/commits/main"
    };

    // STATE
    let state = {
      currentImageIndex: 0,
      images: [],
      startX: 0,
      currentHeaderTextIndex: 0,
      galleryInitialized: false
    };

    // Favorites
    const FAVORITES_KEY = 'lightboxFavorites';
    let favorites = new Set();

    // DOM refs
    let DOM = {};

    function initializeDOMElements() {
      DOM = {
        header: document.getElementById("header"),
        headerText: document.getElementById("header-text"),
        gallery: document.getElementById("gallery"),
        lightbox: document.getElementById("lightbox"),
        lightboxImg: document.getElementById("lightbox-img"),
        downloadBtn: document.getElementById("download"),
        footerText: document.getElementById("footerText"),
        nextBtn: document.querySelector(".next"),
        prevBtn: document.querySelector(".prev"),
        favoriteBtn: document.getElementById("favorite-btn"),
        downloadConfirm: document.getElementById("download-confirm"),
        confirmYes: document.getElementById("confirm-yes"),
        confirmNo: document.getElementById("confirm-no"),
        favoriteIndicator: document.getElementById("favorite-indicator")
      };
    }

    // Load/save favorites
    function loadFavorites() {
      try {
        const raw = localStorage.getItem(FAVORITES_KEY);
        if (raw) JSON.parse(raw).forEach(id => favorites.add(id));
      } catch (e) { console.warn('loadFavorites', e); }
    }
    function saveFavorites() {
      try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favorites))); }
      catch (e) { console.warn('saveFavorites', e); }
    }

    // Cascade / header animation: ensure animation-delay applied directly to spans
    function triggerCascade(element, text, totalDuration = CONFIG.cascadeDuration, loop = true) {
      clearTimeout(element.cascadeTimer);
      element.style.visibility = "visible";
      element.textContent = "";
      const len = Math.max(1, text.length);
      const delayIncrement = totalDuration / len;
      for (let i = 0; i < text.length; i++) {
        const span = document.createElement("span");
        span.innerHTML = (text[i] === " ") ? "&nbsp;" : text[i];
        // Set both CSS variable and direct style to be robust:
        span.style.setProperty("--delay", `${i * delayIncrement}s`);
        span.style.animationDelay = `${i * delayIncrement}s`;
        span.className = "cascade-char";
        element.appendChild(span);
      }
      if (loop) {
        element.cascadeTimer = setTimeout(() => {
          triggerCascade(element, text, totalDuration, loop);
        }, (totalDuration + CONFIG.textLinger) * 1000);
      }
    }
    function cycleHeaderTexts() {
      // ensure headerText is visible before we start
      DOM.headerText.style.visibility = "visible";
      triggerCascade(DOM.headerText, CONFIG.headerTexts[state.currentHeaderTextIndex]);
      state.currentHeaderTextIndex = (state.currentHeaderTextIndex + 1) % CONFIG.headerTexts.length;
      setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);
    }

    // Download helpers (fetch->blob->anchor)
    async function downloadImageByFetch(url, filename) {
      const resp = await fetch(url, { mode: 'cors' });
      if (!resp.ok) throw new Error(`Fetch failed: ${resp.status}`);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      triggerAnchorDownload(blobUrl, filename);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 20_000);
    }
    function triggerAnchorDownload(href, filename) {
      const a = document.createElement('a');
      a.href = href;
      a.download = filename || (href.split('/').pop());
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    async function downloadCurrentImage() {
      const item = state.images[state.currentImageIndex];
      if (!item) return;
      await downloadImageByFetch(item.src, item.src.split('/').pop());
      sendVisitorData("download", item.src.split('/').pop());
    }
    async function downloadAllSequential() {
      for (let i = 0; i < state.images.length; i++) {
        const it = state.images[i];
        try {
          await downloadImageByFetch(it.src, it.src.split('/').pop() || `image-${i+1}.jpg`);
          await new Promise(r => setTimeout(r, 150));
          sendVisitorData("download_all", it.src.split('/').pop());
        } catch (e) {
          console.error('downloadAllSequential error', e);
        }
      }
    }

    // Control visibility only when lightbox is open
    function showDownloadConfirm() {
      // Only show if lightbox is visible
      const isOpen = DOM.lightbox && window.getComputedStyle(DOM.lightbox).display === 'flex';
      if (!isOpen) return;
      DOM.downloadConfirm.classList.remove('hidden');
    }
    function hideDownloadConfirm() { DOM.downloadConfirm.classList.add('hidden'); }

    // Show/hide lightbox and update UI
    function showImage(index) {
      state.images = document.querySelectorAll("#gallery img");
      if (!state.images.length) return;
      state.currentImageIndex = index;
      DOM.lightboxImg.src = state.images[index].src;
      DOM.downloadBtn.href = state.images[index].src;
      DOM.downloadBtn.setAttribute('download', state.images[index].src.split('/').pop());
      updateFavoriteUI(state.images[index].src);
    }
    function openLightbox(imgElement) {
      state.images = document.querySelectorAll("#gallery img");
      state.currentImageIndex = Array.from(state.images).indexOf(imgElement);
      DOM.lightbox.style.display = "flex";
      showImage(state.currentImageIndex);
    }
    function closeLightbox() {
      DOM.lightbox.style.display = "none";
      saveFavorites();
      hideDownloadConfirm();
    }

    // Favorites UI
    function toggleFavorite() {
      const current = state.images[state.currentImageIndex];
      if (!current) return;
      const id = current.src;
      if (favorites.has(id)) favorites.delete(id);
      else favorites.add(id);
      updateFavoriteUI(id);
    }
    function updateFavoriteUI(id) {
      const isFav = favorites.has(id);
      DOM.favoriteBtn.classList.toggle('favorited', isFav);
      DOM.favoriteBtn.textContent = isFav ? '♥' : '♡';
      DOM.favoriteBtn.setAttribute('aria-pressed', String(isFav));
      DOM.favoriteBtn.title = isFav ? 'Unfavorite' : 'Favorite';
      DOM.favoriteIndicator.style.display = isFav ? 'block' : 'none';
    }

    // Other helpers and gallery loading (kept as you had them)
    function waitForImagesOrTimeout(images, timeoutMs = CONFIG.imageLoadTimeout) {
      return new Promise((resolve) => {
        let loadedCount = 0;
        const totalImages = images.length;
        if (totalImages === 0) { resolve(); return; }
        const timeoutId = setTimeout(resolve, timeoutMs);
        images.forEach((img) => {
          if (img.complete) {
            loadedCount++;
            if (loadedCount === totalImages) { clearTimeout(timeoutId); resolve(); }
          } else {
            img.addEventListener('load', () => {
              loadedCount++;
              if (loadedCount === totalImages) { clearTimeout(timeoutId); resolve(); }
            });
            img.addEventListener('error', () => {
              loadedCount++;
              if (loadedCount === totalImages) { clearTimeout(timeoutId); resolve(); }
            });
          }
        });
      });
    }

    function isPageReloaded() {
      if (performance.getEntriesByType('navigation')[0]) {
        return performance.getEntriesByType('navigation')[0].type === 'reload';
      } else if (performance.navigation) {
        return performance.navigation.type === performance.navigation.RELOAD;
      }
      return false;
    }

    function sendVisitorData(eventType = "visit", imageName = "") {
      const data = { event: eventType, time: new Date().toISOString(), Image: imageName, device: navigator.userAgent };
      fetch(CONFIG.sheetsUrl, { method: "POST", body: JSON.stringify(data) }).catch(err => console.error("Log failed:", err));
    }

    // load images sequentially (kept mostly unchanged)
    async function loadImagesSequentially() {
      for (let i = 1; i <= CONFIG.maxPhotos; i++) {
        const img = document.createElement("img");
        img.style.visibility = "hidden";
        img.src = `images/photo${i}.jpg`;
        img.onerror = function () { this.remove(); };
        await new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
        DOM.gallery.appendChild(img);
        updateLayout();
        img.style.visibility = "visible";
        try { await img.animate([{ opacity: 0, transform: "scale(0.05)" }, { opacity: 1, transform: "scale(1)" }], { duration: CONFIG.imageAnimationDuration, easing: "cubic-bezier(0.68,-0.55,0.265,1.55)" }).finished; } catch(e){}
        await new Promise(resolve => setTimeout(resolve, CONFIG.imageDelayBetween));
      }
      state.images = document.querySelectorAll("#gallery img");
      DOM.footerText.style.display = "block";
      DOM.footerText.style.opacity = "1";
      state.galleryInitialized = true;
    }

    function updateLayout() {
      const imgs = document.querySelectorAll("#gallery img");
      const isMobile = /Mobile|Android|iPhone/i.test(navigator.userAgent);
      DOM.gallery.classList.remove("fullscreen");
      DOM.gallery.style.display = "flex";
      DOM.gallery.style.flexWrap = "wrap";
      imgs.forEach(img => {
        img.style.display = "block";
        img.style.height = "auto";
        img.style.margin = "5px";
        img.style.boxShadow = "0 4px 12px rgba(0, 0, 0, 0.9)";
        if (isMobile) {
          img.style.width = "calc(100% - 20px)";
        } else {
          img.style.width = "calc(25% - 20px)";
        }
      });
    }

    function navigateImage(direction) {
      if (!state.images.length) return;
      const step = direction === 'next' ? 1 : -1;
      state.currentImageIndex = (state.currentImageIndex + step + state.images.length) % state.images.length;
      showImage(state.currentImageIndex);
    }

    function adjustGalleryPosition() { DOM.gallery.style.marginTop = DOM.header.offsetHeight + "px"; }

    // GitHub commit check (kept with catch fallback)
    function fetchLatestCommitSha() {
      fetch(CONFIG.githubApiUrl)
        .then(r => r.json())
        .then(data => {
          const latestCommitSha = data.sha;
          const storedSha = localStorage.getItem('storedSha');
          DOM.headerText.style.visibility = "visible";
          if (latestCommitSha !== storedSha) {
            localStorage.setItem('storedSha', latestCommitSha);
            cycleHeaderTexts();
          } else {
            // if same sha, still ensure header shows something and animate it
            triggerCascade(DOM.headerText, "More images soon...", CONFIG.cascadeDuration, false);
            setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);
          }
          initializeTracking();
        })
        .catch(err => {
          console.warn('GitHub API failed', err);
          DOM.headerText.style.visibility = "visible";
          cycleHeaderTexts();
          initializeTracking();
        });
    }

    function initializeTracking() {
      const pageSessionKey = 'pageSessionId';
      if (!sessionStorage.getItem(pageSessionKey)) {
        sessionStorage.setItem(pageSessionKey, 1);
        sendVisitorData("visit");
      }
    }

    // Event listeners
    function setupEventListeners() {
      // gallery click
      DOM.gallery.addEventListener("click", (e) => { if (e.target.tagName === "IMG") openLightbox(e.target); });

      DOM.nextBtn?.addEventListener("click", () => navigateImage('next'));
      DOM.prevBtn?.addEventListener("click", () => navigateImage('prev'));

      document.addEventListener("keydown", (e) => {
        if (window.getComputedStyle(DOM.lightbox).display !== "flex") return;
        if (e.key === "ArrowRight") DOM.nextBtn?.click();
        if (e.key === "ArrowLeft") DOM.prevBtn?.click();
        if (e.key === "Escape") closeLightbox();
      });

      DOM.lightbox.addEventListener("click", (e) => { if (e.target === DOM.lightbox) closeLightbox(); });

      // touch swipe
      DOM.lightbox.addEventListener("touchstart", (e) => { state.startX = e.touches[0].clientX; });
      DOM.lightbox.addEventListener("touchend", (e) => {
        const endX = e.changedTouches[0].clientX;
        const diff = state.startX - endX;
        if (diff > CONFIG.touchSwipeThreshold) DOM.nextBtn?.click();
        if (diff < -CONFIG.touchSwipeThreshold) DOM.prevBtn?.click();
      });

      // favorite button
      DOM.favoriteBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFavorite(); });

      // download button: only show confirm when lightbox is open
      DOM.downloadBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        showDownloadConfirm();
      });

      DOM.confirmYes.addEventListener("click", async () => {
        hideDownloadConfirm();
        try { await downloadAllSequential(); } catch (err) { console.error(err); }
      });

      DOM.confirmNo.addEventListener("click", async () => {
        hideDownloadConfirm();
        try { await downloadCurrentImage(); } catch (err) { console.error(err); }
      });

      window.addEventListener("scroll", () => {/* blur effect kept if needed */});
      window.addEventListener("resize", updateLayout);
      window.addEventListener("resize", adjustGalleryPosition);

      window.addEventListener("load", async () => { if (!state.galleryInitialized) await loadImagesSequentially(); });
      window.addEventListener("load", adjustGalleryPosition);
    }

    function initializeApp() {
      initializeDOMElements();
      loadFavorites();
      fetchLatestCommitSha();
      setupEventListeners();
      document.getElementById('year').textContent = new Date().getFullYear();
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>
