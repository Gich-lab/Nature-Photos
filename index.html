<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="tab-icon.ico" type="image/x-icon" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    .main-header {color: green;font-weight: bold;font-size: 2em;text-align: center;margin-top: 15px; margin-bottom: 20px}
  </style>   
</head>
<body>
    <header class="main-header" id="header">
      <div class="header-inner">
        <span class="cascade-text" id="header-text" style="visibility: hidden;"></span>
      </div>
    </header>
    <main>
        <div id="gallery" class="gallery"></div>

        <div id="lightbox" class="lightbox">

            <div class="lightbox-content">

                <button class="lightbox-btn prev">❮ Prev</button>

                <img id="lightbox-img" src="" alt="Enlarged image">

                <button class="lightbox-btn next">Next ❯</button>

                <a id="download" class="lightbox-btn download-btn" download>Download</a>

            </div> <!-- lightbox-content -->

        </div> <!-- lightbox -->
    </main>

    <footer>
      <p id="footerText" class="footer">
          &copy; <span id="year"></span> 2026 Gichuki. All rights reserved.
        <!--&copy; 2026 Gichuki. All rights reserved.-->
        <a href="mailto:kenngich@proton.me" class="mail-link">✉️</a> E-mail
      </p>
    </footer>
    
  <script>
    // CONFIGURATION
    const CONFIG = {
      maxPhotos: 120,
      imageLoadTimeout: 1000,
      textCycleDuration: 15000,
      cascadeDuration: 6,
      textLinger: 10,
      imageAnimationDuration: 700,
      imageDelayBetween: 0,
      touchSwipeThreshold: 50,
      headerTexts: [
        "Explore my wallpapers..",
        "Mti leo, kivuli kesho",
        "Less junk, more jungle!",
        "Think green, act cleaner",
        "Mito yastahili kutunzwa",
        "itunze mito uishi fiti",
        "Stay wild & awesome!",
        "Get lost, find nature!",
        "Kata takataka si miti",
        "Trees are judging quietly",
        "Waste less, wonder more!",
        "Dunia yajua unakozoa taka",
        "Plant now, brag later!",
        "itunze dunia ikutunze"
      ],
      gaId: "G-22HE9GQ99B",
      gaScript: "https://www.googletagmanager.com/gtag/js?id=G-22HE9GQ99B",
      sheetsUrl: "https://script.google.com/macros/s/AKfycbwMC8P52A8DPBcwcN3JFU4ov1mPg4e15zmnMfEVnJYVntfz0vy1zVGiBp75O7u5avId/exec",
      githubApiUrl: "https://api.github.com/repos/Gich-lab/Nature-Photos/commits/main"
    };

    // STATE
    let state = {
      currentImageIndex: 0,
      images: [],
      startX: 0,
      currentHeaderTextIndex: 0,
      galleryInitialized: false
    };

    // DOM ELEMENTS - Initialized after DOMContentLoaded
    let DOM = {};

    function initializeDOMElements() {
      DOM = {
        header: document.getElementById("header"),
        headerText: document.getElementById("header-text"),
        gallery: document.getElementById("gallery"),
        lightbox: document.getElementById("lightbox"),
        lightboxImg: document.getElementById("lightbox-img"),
        downloadBtn: document.getElementById("download"),
        footerText: document.getElementById("footerText"),
        nextBtn: document.querySelector(".next"),
        prevBtn: document.querySelector(".prev")
      };
    }

    // Wait for images to load or timeout 
    function waitForImagesOrTimeout(images, timeoutMs = CONFIG.imageLoadTimeout) {
      return new Promise((resolve) => {
        let loadedCount = 0;
        const totalImages = images.length;

        if (totalImages === 0) {
          resolve();
          return;
        }

        const timeoutId = setTimeout(resolve, timeoutMs);

        images.forEach((img) => {
          if (img.complete) {
            loadedCount++;
            if (loadedCount === totalImages) {
              clearTimeout(timeoutId);
              resolve();
            }
          } else {
            img.addEventListener('load', () => {
              loadedCount++;
              if (loadedCount === totalImages) {
                clearTimeout(timeoutId);
                resolve();
              }
            });
          }
        });
      });
    }

    // Check if page was reloaded 
    function isPageReloaded() {
      if (performance.getEntriesByType('navigation')[0]) {
        const navType = performance.getEntriesByType('navigation')[0].type;
        return navType === 'reload';
      } else if (performance.navigation) {
        return performance.navigation.type === performance.navigation.RELOAD;
      }
      return false;
    }

    // Load Google Analytics 
    function loadGA() {
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', CONFIG.gaId);
      const script = document.createElement('script');
      script.async = true;
      script.src = CONFIG.gaScript;
      document.head.appendChild(script);
    }

    // Detect device type 
    function detectDevice() {
      const ua = navigator.userAgent;
      return /Mobile|Android|iPhone/i.test(ua) ? "Phone" : "Desktop";
    }

    // Detect operating system 
    function detectOS() {
      const ua = navigator.userAgent;
      const osMap = {
        "Win": "Windows",
        "Android": "Android",
        "iPhone": "iOS",
        "iPad": "iOS",
        "Linux": "Linux",
        "Mac": "MacOS"
      };
      
      for (const [key, value] of Object.entries(osMap)) {
        if (ua.includes(key)) return value;
      }
      return "Unknown";
    }

    // Detect browser 
    function detectBrowser() {
      const ua = navigator.userAgent;
      const browserChecks = [
        { pattern: /Edg/i, name: "Edge" },
        { pattern: /Brave/i, name: "Brave" },
        { pattern: /Chrome/i, notPattern: /Edge|OPR/i, name: "Chrome" },
        { pattern: /Safari/i, notPattern: /Chrome/i, name: "Safari" },
        { pattern: /Firefox/i, name: "Firefox" },
        { pattern: /OPR|Opera/i, name: "Opera" }
      ];

      for (const check of browserChecks) {
        if (check.pattern.test(ua) && (!check.notPattern || !check.notPattern.test(ua))) {
          return check.name;
        }
      }
      return "Other";
    }

    // Get device information object 
    function getDeviceInfo() {
      return {
        device: detectDevice(),
        os: detectOS(),
        browser: detectBrowser(),
        screen: `${window.innerWidth}x${document.documentElement.clientHeight}`
      };
    }

    // Send visitor data to Google Sheets 
    function sendVisitorData(eventType = "visit", imageName = "") {
      const data = {
        event: eventType,
        time: new Date().toISOString(),
        Image: imageName,
        ...getDeviceInfo()
      };

      fetch(CONFIG.sheetsUrl, {
        method: "POST",
        body: JSON.stringify(data)
      }).catch(err => console.error("Log failed:", err));
    }

    // Initialize visitor tracking (once per session) 
    function initializeTracking() {
      const pageSessionKey = 'pageSessionId';
      if (!sessionStorage.getItem(pageSessionKey)) {
        sessionStorage.setItem(pageSessionKey, 1);
        sendVisitorData("visit");
      }
    }

    // Trigger cascade animation for text 
    function triggerCascade(element, text, totalDuration = CONFIG.cascadeDuration, loop = true) {
      clearTimeout(element.cascadeTimer);
      
      function animate() {
        element.style.visibility = "visible";
        element.textContent = "";
        const delayIncrement = totalDuration / text.length;
        
        for (let i = 0; i < text.length; i++) {
          const span = document.createElement("span");
          span.innerHTML = (text[i] === " ") ? "&nbsp;" : text[i];
          span.style.setProperty("--delay", `${i * delayIncrement}s`);
          element.appendChild(span);
        }

        if (loop) {
          element.cascadeTimer = setTimeout(animate, (totalDuration + CONFIG.textLinger) * 1000);
        }
      }
      animate();
    }

    // Cycle through header texts 
    function cycleHeaderTexts() {
      triggerCascade(DOM.headerText, CONFIG.headerTexts[state.currentHeaderTextIndex]);
      state.currentHeaderTextIndex = (state.currentHeaderTextIndex + 1) % CONFIG.headerTexts.length;
      setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);
    }

    // Animate image with scale pinpoint effect 
    function animateImageAppearance(img) {
      return img.animate(
        [
          { opacity: 0, transform: "scale(0.05)" },
          { opacity: 1, transform: "scale(1)" }
        ],
        {
          duration: CONFIG.imageAnimationDuration,
          easing: "cubic-bezier(0.68, -0.55, 0.265, 1.55)",
          iterations: 1
        }
      ).finished;
    }

    // Load images sequentially with animation 
    async function loadImagesSequentially() {
      for (let i = 1; i <= CONFIG.maxPhotos; i++) {
        const img = document.createElement("img");
        img.style.visibility = "hidden";
        img.src = `images/photo${i}.jpg`;

        const loaded = await new Promise(resolve => {
          img.addEventListener('load', () => resolve(true), { once: true });
          img.addEventListener('error', () => resolve(false), { once: true });
        });

        if (!loaded) continue; // skip this photo entirely — never gets appended

        DOM.gallery.appendChild(img);

        updateLayout();
        img.style.visibility = "visible";
        await animateImageAppearance(img);
        await new Promise(resolve => setTimeout(resolve, CONFIG.imageDelayBetween));
      }

      state.images = document.querySelectorAll("#gallery img");
      document.getElementById("footerText").style.display = "block";
      DOM.footerText.style.opacity = "1";
      state.galleryInitialized = true;
    }

    // Update gallery layout based on device 
    function updateLayout() {
      const imgs = document.querySelectorAll("#gallery img");
      const isMobile = detectDevice() === "Phone";

      DOM.gallery.classList.remove("fullscreen");
      DOM.gallery.style.display = "flex";
      DOM.gallery.style.flexWrap = "wrap";

      imgs.forEach(img => {
        img.style.display = "block";
        img.style.height = "auto";
        img.style.margin = "5px";
        img.style.boxShadow = "0 4px 12px rgba(0, 0, 0, 0.9)";
        
        if (isMobile) {
          img.style.width = "calc(100% - 20px)";
          img.style.borderRadius = "0.3%";
        } else {
          img.style.width = "calc(25% - 20px)";
          img.style.borderRadius = "0.6%";
          img.style.opacity = "1";
        }
      });
    }

    // Adjust gallery position below header 
    function adjustGalleryPosition() {
      DOM.gallery.style.marginTop = DOM.header.offsetHeight + "px";
    }

    // Show image in lightbox 
    function showImage(index) {
      state.images = document.querySelectorAll("#gallery img");
      if (!state.images.length) return;

      state.currentImageIndex = index;
      DOM.lightboxImg.src = state.images[index].src;

      DOM.downloadBtn.href = state.images[index].src;
      DOM.downloadBtn.download = state.images[index].src.split('/').pop();
    }

    // Navigate to next/previous image 
    function navigateImage(direction) {
      if (!state.images.length) return;
      const step = direction === 'next' ? 1 : -1;
      state.currentImageIndex = (state.currentImageIndex + step + state.images.length) % state.images.length;
      showImage(state.currentImageIndex);
    }

    // Close lightbox 
    function closeLightbox() {
      DOM.lightbox.style.display = "none";
      DOM.lightbox.classList.remove("show-download");
    }

    // Open lightbox with image 
    function openLightbox(imgElement) {
      state.images = document.querySelectorAll("#gallery img");
      state.currentImageIndex = Array.from(state.images).indexOf(imgElement);
      DOM.lightbox.style.display = "flex";
      DOM.lightbox.classList.add("show-download");
      showImage(state.currentImageIndex);
    }

    // Handle scroll blur effect 
    function handleScrollBlur() {
      const headerBottom = DOM.header.getBoundingClientRect().bottom + window.scrollY;
      
      document.querySelectorAll("#gallery img").forEach(img => {
        const rect = img.getBoundingClientRect();
        const imgTop = rect.top + window.scrollY;
        
        if (imgTop < headerBottom) {
          img.classList.add("blur-img");
        } else {
          img.classList.remove("blur-img");
        }
      });
    }

    // Fetch latest commit and manage content updates 
    function fetchLatestCommitSha() {
      fetch(CONFIG.githubApiUrl)
        .then(response => response.json())
        .then(data => {
          const latestCommitSha = data.sha;
          const storedSha = localStorage.getItem('storedSha');

          DOM.headerText.style.visibility = "visible";
          initializeTracking();

          if (latestCommitSha === storedSha && isPageReloaded()) {
            // Page reloaded with same content - don't reload images, just show footer
            DOM.headerText.textContent = "More images soon...";
            triggerCascade(DOM.headerText, DOM.headerText.textContent, CONFIG.cascadeDuration, false);
            setTimeout(cycleHeaderTexts, CONFIG.textCycleDuration);
            
            // Show existing images without animation
            state.images = document.querySelectorAll("#gallery img");
            if (state.images.length > 0) {
              DOM.footerText.style.opacity = "1";
              state.galleryInitialized = true;
            }
          } else if (latestCommitSha !== storedSha) {
            // New content - load images with animation
            cycleHeaderTexts();
            localStorage.setItem('storedSha', latestCommitSha);
            loadGA();
          }

          window.addEventListener('load', () => {
            waitForImagesOrTimeout(document.querySelectorAll('img'));
          });
        });
    }

    // Initialize all event listeners 
    function setupEventListeners() {
      // Gallery image click
      DOM.gallery.addEventListener("click", (e) => {
        if (e.target.tagName === "IMG") {
          openLightbox(e.target);
        }
      });

      // Navigation buttons
      if (DOM.nextBtn) {
        DOM.nextBtn.addEventListener("click", () => navigateImage('next'));
      }
      if (DOM.prevBtn) {
        DOM.prevBtn.addEventListener("click", () => navigateImage('prev'));
      }
      
      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (DOM.lightbox.style.display !== "flex") return;
        if (e.key === "ArrowRight") DOM.nextBtn?.click();
        if (e.key === "ArrowLeft") DOM.prevBtn?.click();
        if (e.key === "Escape") closeLightbox();
      });

      // Close lightbox on background click
      DOM.lightbox.addEventListener("click", (e) => {
        if (e.target === DOM.lightbox) {
          closeLightbox();
        }
      });
      
      // Touch swipe support
      DOM.lightbox.addEventListener("touchstart", (e) => {
        state.startX = e.touches[0].clientX;
      });
      DOM.lightbox.addEventListener("touchend", (e) => {
        const endX = e.changedTouches[0].clientX;
        const diff = state.startX - endX;
        if (diff > CONFIG.touchSwipeThreshold) DOM.nextBtn?.click();
        if (diff < -CONFIG.touchSwipeThreshold) DOM.prevBtn?.click();
      });

      // Download button
      DOM.downloadBtn.addEventListener("click", () => {
        sendVisitorData("download", DOM.lightboxImg.src.split('/').pop());
      });

      // Scroll blur effect
      window.addEventListener("scroll", handleScrollBlur);

      // Layout updates
      window.addEventListener("resize", updateLayout);
      window.addEventListener("resize", adjustGalleryPosition);

      // Page load initialization
      window.addEventListener("load", async () => {
        // Only load images if gallery is not already initialized
        if (!state.galleryInitialized) {
          await loadImagesSequentially();
        }
      });
      window.addEventListener("load", adjustGalleryPosition);
    }

    // Initialize the entire application
    function initializeApp() {
      initializeDOMElements();
      fetchLatestCommitSha();
      setupEventListeners();  
    }

    // Start the application when DOM is ready
    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>
